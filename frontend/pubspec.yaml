name: annora
description: Annora -- meal planning, pantry, and grocery delivery app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^2.5.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
  assets:
    - .env
